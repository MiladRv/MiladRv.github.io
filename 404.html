<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not Found</title>
<style>
  :root{--bg:#0a0d12;--text:#c9d4e0;--dim:#6b7a8c;--green:#6dffb0;--red:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.7 ui-monospace,Consolas,monospace;padding:16px}
  .box{max-width:520px;border:1px solid #1f2935;border-radius:12px;padding:24px;background:#10151c}
  h1{margin:0 0 8px;font-size:44px;color:var(--red)}
  .d{color:var(--dim)} a{color:var(--green)}
</style>
</head>
<body>
<div class="box">
  <h1>404</h1>
  <p>HTTP/1.1 <span style="color:var(--red)">404 Not Found</span></p>
  <p class="d">The route you requested doesn't exist on this server.</p>
  <p><span style="color:var(--green)">$</span> <a href="/">cd /</a></p>
</div>
</body>
</html>
